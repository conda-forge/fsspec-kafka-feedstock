context:
  version: "0.3.0"

package:
  name: fsspec-kafka
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fsspec-kafka/fsspec_kafka-${{ version }}.tar.gz
  sha256: de8e9dede58c91dfa9d643cd47334d667bacda7ca63109f674702335e17a9139

build:
  number: 0
  python:
    version_independent: true
  script:
    - if: unix
      then: export PYO3_PYTHON="$PYTHON"
      else: set "PYO3_PYTHON=%PYTHON%"
    - if: linux
      # Bundled krb5 uses legacy function pointers that GCC 15's default C23 rejects.
      then: export CFLAGS="${CFLAGS} -std=gnu17"
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: is_abi3 and not is_python_min

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python ${{ python_min }}.*
        - cross-python_${{ target_platform }}
        - crossenv
        - hatchling
        - hatch-rs >=0.6.1
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cmake
    - ninja
    - pkgconf
    - perl
    - if: unix
      then:
        - make
        - bison
  host:
    - python
    - pip
    - hatchling
    - hatch-rs >=0.6.1
    - fsspec-rs >=0.2.1,<0.3
    - if: is_abi3
      then:
        - python-abi3
  run:
    - python
    - fsspec
    - fsspec-data >=0.8.0,<0.9
    - fsspec-rs >=0.2.1,<0.3

tests:
  - python:
      imports:
        - fsspec_kafka
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

  - script:
      - python -m pytest -v -o addopts="" --ignore=fsspec_kafka/tests/integration fsspec_kafka/tests
      - python -c "import fsspec, fsspec_kafka; assert fsspec_kafka.linked_to_libfsspec(); assert fsspec.get_filesystem_class('kafka') is fsspec_kafka.KafkaFileSystem"
    files:
      source:
        - fsspec_kafka/tests
    requirements:
      run:
        - pytest

  - if: is_abi3
    then:
      script:
        - if: win
          then: abi3audit %SP_DIR%/fsspec_kafka/fsspec_kafka.pyd -s -v --assume-minimum-abi3 ${{ python_min }}
          else: abi3audit $SP_DIR/fsspec_kafka/fsspec_kafka.abi3.so -s -v --assume-minimum-abi3 ${{ python_min }}
      requirements:
        run:
          - abi3audit

about:
  homepage: https://github.com/1kbgz/fsspec-kafka
  repository: https://github.com/1kbgz/fsspec-kafka
  summary: Kafka topics and partitions through fsspec
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - timkpaine
